name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cache third-party deps via actions/cache
  AIRTREE_DEPS_CACHE_ENABLED: "OFF"
  BUILD_TYPE: RelWithDebInfo
  TOOLCHAIN: gnu-11
  SANITIZER: nosan

jobs:
  build-test:
    name: ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # preinstalled SDKs we never use to take / from ~20 GB free to ~45-55 GB.
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      # Restore the dep install tree on every run
      - name: Restore deps cache
        id: deps_cache
        uses: actions/cache/restore@v5
        with:
          path: cmake-build-${{ env.TOOLCHAIN }}-${{ env.BUILD_TYPE }}-${{ env.SANITIZER }}/.airmettle/airtree-deps
          key: deps-ubuntu22.04-${{ env.TOOLCHAIN }}-${{ hashFiles('cmake/Settings.cmake', 'cmake/third-party/**', 'cmake/DepsRegistry.cmake') }}
          restore-keys: |
            deps-ubuntu22.04-${{ env.TOOLCHAIN }}-

      - name: Build
        run: bash tools/build/build.sh

      - name: Save deps cache
        if: success() && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master') && steps.deps_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: cmake-build-${{ env.TOOLCHAIN }}-${{ env.BUILD_TYPE }}-${{ env.SANITIZER }}/.airmettle/airtree-deps
          key: ${{ steps.deps_cache.outputs.cache-primary-key }}

  notify:
    needs: build-test
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Gather run metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.build-test.result }}
          EVENT: ${{ github.event_name }}
          PUSH_BRANCH: ${{ github.ref_name }}
          PR_BRANCH: ${{ github.head_ref }}
          PUSH_SHA: ${{ github.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then branch="$PUSH_BRANCH"; sha="$PUSH_SHA"; else branch="$PR_BRANCH"; sha="$PR_SHA"; fi
          if [ "$RESULT" = "success" ]; then emoji=":white_check_mark:"; status="passed"; else emoji=":red_circle:"; status="failed"; fi
          started=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq '.run_started_at' 2>/dev/null || true)
          now=$(date -u +%s)
          if [ -n "$started" ] && start_ts=$(date -u -d "$started" +%s 2>/dev/null); then dur=$((now - start_ts)); duration="$((dur/60))m $((dur%60))s"; else duration="n/a"; fi
          {
            echo "emoji=$emoji"
            echo "status=$status"
            echo "branch=$branch"
            echo "sha=${sha:0:7}"
            echo "duration=$duration"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ github.event_name == 'push' && secrets.SLACK_QA_CHANNEL || github.event_name == 'pull_request' && secrets.SLACK_BUILD_CHANNEL || '' }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.meta.outputs.emoji }} *AirTree CI ${{ steps.meta.outputs.status }}* on `${{ steps.meta.outputs.branch }}`"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Branch:*\n`${{ steps.meta.outputs.branch }}`"
                  - type: "mrkdwn"
                    text: "*Commit:*\n`${{ steps.meta.outputs.sha }}`"
                  - type: "mrkdwn"
                    text: "*Duration:*\n${{ steps.meta.outputs.duration }}"
                  - type: "mrkdwn"
                    text: "*Triggered by:*\n${{ github.actor }}"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View CI run> · run #${{ github.run_number }}"
