name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cache third-party deps via actions/cache
  AIRTREE_DEPS_CACHE_ENABLED: "OFF"
  BUILD_TYPE: RelWithDebInfo
  TOOLCHAIN: gnu-11
  SANITIZER: nosan

jobs:
  build-test:
    name: ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # preinstalled SDKs we never use to take / from ~20 GB free to ~45-55 GB.
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      # Cache only the resolved dependency install tree, not AirTree's own build.
      # Key rotates when a dep version/recipe/graph changes; on a near-miss the
      # restore-keys prefix restores the last good tree and CMake's per-dep hash
      # rebuilds only what actually changed.
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: cmake-build-${{ env.TOOLCHAIN }}-${{ env.BUILD_TYPE }}-${{ env.SANITIZER }}/.airmettle/airtree-deps
          key: deps-ubuntu22.04-${{ env.TOOLCHAIN }}-${{ hashFiles('cmake/Settings.cmake', 'cmake/third-party/**', 'cmake/DepsRegistry.cmake') }}
          restore-keys: |
            deps-ubuntu22.04-${{ env.TOOLCHAIN }}-

      - name: Build
        run: bash tools/build/build.sh
