name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cache third-party deps via actions/cache
  AIRTREE_DEPS_CACHE_ENABLED: "OFF"
  BUILD_TYPE: RelWithDebInfo
  TOOLCHAIN: gnu-11
  SANITIZER: nosan

jobs:
  build-test:
    name: ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # preinstalled SDKs we never use to take / from ~20 GB free to ~45-55 GB.
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      # Restore the dep install tree on every run
      - name: Restore deps cache
        id: deps_cache
        uses: actions/cache/restore@v5
        with:
          path: cmake-build-${{ env.TOOLCHAIN }}-${{ env.BUILD_TYPE }}-${{ env.SANITIZER }}/.airmettle/airtree-deps
          key: deps-ubuntu22.04-${{ env.TOOLCHAIN }}-${{ hashFiles('cmake/Settings.cmake', 'cmake/third-party/**', 'cmake/DepsRegistry.cmake') }}
          restore-keys: |
            deps-ubuntu22.04-${{ env.TOOLCHAIN }}-

      - name: Build
        run: bash tools/build/build.sh

      - name: Save deps cache
        if: success() && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master') && steps.deps_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: cmake-build-${{ env.TOOLCHAIN }}-${{ env.BUILD_TYPE }}-${{ env.SANITIZER }}/.airmettle/airtree-deps
          key: ${{ steps.deps_cache.outputs.cache-primary-key }}
