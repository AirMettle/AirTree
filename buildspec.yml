version: 0.2

env:
  shell: bash
  secrets-manager:
    YML_AWS_ACCESS_KEY_ID: "BENCHMARK_API_KEY:ACCESS_KEY_ID"
    YML_AWS_SECRET_ACCESS_KEY: "BENCHMARK_API_KEY:SECRET_ACCESS_KEY"
  git-credential-helper: yes

phases:
  install:
    commands:
  pre_build:
    commands:
      - "export AWS_ACCESS_KEY_ID=\"${YML_AWS_ACCESS_KEY_ID}\""
      - "export AWS_SECRET_ACCESS_KEY=\"${YML_AWS_SECRET_ACCESS_KEY}\""
  build:
    commands:
      - echo Build started on `date`
      - bash "${CODEBUILD_SRC_DIR}/tools/build/build.sh" setup airtree
      - bash "${CODEBUILD_SRC_DIR}/tools/build/upload_dep_cache.sh"
  post_build:
    commands:
      - echo Build completed on `date`
